<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FBCA Mission Control</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #1a2332 100%);
      color: #e0e6ed;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #1B365F;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
    }

    .health-badge {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .health-badge.healthy {
      background: #10b981;
      color: white;
    }

    .health-badge.warning {
      background: #f59e0b;
      color: white;
    }

    .health-badge.error {
      background: #ef4444;
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: rgba(27, 54, 95, 0.4);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      background: #004da8;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .badge-red {
      background: #ef4444;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .toggle-group {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 8px;
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      color: #9ca3af;
      white-space: nowrap;
    }

    .toggle-btn:hover {
      color: #e0e6ed;
    }

    .toggle-btn.active {
      background: #004da8;
      color: white;
    }

    .item {
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .item:last-child {
      margin-bottom: 0;
    }

    .item-title {
      font-weight: 500;
      margin-bottom: 6px;
    }

    .item-meta {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #10b981;
      color: white;
    }

    .btn-primary:hover {
      background: #059669;
    }

    .btn-secondary {
      background: #6b7280;
      color: white;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #9ca3af;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.1rem;
      color: #9ca3af;
    }

    .timestamp {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #6b7280;
    }

    .agent-entry {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .agent-entry:last-child {
      border-bottom: none;
    }

    .agent-time {
      color: #6b7280;
      font-size: 0.85rem;
      min-width: 50px;
    }

    .agent-name {
      font-weight: 600;
      color: #10b981;
      min-width: 100px;
    }

    .agent-action {
      flex: 1;
      color: #e0e6ed;
    }

    /* Department Sections */
    .dept-section {
      margin-bottom: 12px;
      border-radius: 8px;
      overflow: hidden;
    }

    .dept-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .dept-header:hover {
      filter: brightness(1.1);
    }

    .dept-header.unassigned {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .dept-header.it {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
    }

    .dept-header.maintenance {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fcd34d;
    }

    .dept-header.cleaning {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .dept-content {
      padding: 8px;
      display: none;
    }

    .dept-content.expanded {
      display: block;
    }

    .dept-content.always-expanded {
      display: block;
    }

    .dept-icon {
      margin-right: 8px;
    }

    .collapse-icon {
      margin-left: 8px;
      font-size: 0.8rem;
      transition: transform 0.2s;
    }

    .collapse-icon.rotated {
      transform: rotate(180deg);
    }

    /* Bar Chart */
    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 24px;
      padding: 20px 10px;
      height: 200px;
      justify-content: center;
    }

    .bar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: 80px;
    }

    .bar {
      width: 100%;
      border-radius: 6px 6px 0 0;
      min-height: 4px;
      transition: all 0.3s ease;
      position: relative;
    }

    .bar-value {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 700;
      font-size: 1rem;
      color: #e0e6ed;
    }

    .bar-label {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #9ca3af;
      text-align: center;
    }

    .bar.it { background: linear-gradient(180deg, #3b82f6, #1d4ed8); }
    .bar.maintenance { background: linear-gradient(180deg, #f59e0b, #b45309); }
    .bar.cleaning { background: linear-gradient(180deg, #10b981, #047857); }
    .bar.unassigned { background: linear-gradient(180deg, #ef4444, #991b1b); }

    .stats-summary {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin-top: 8px;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
    }

    .stat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* --- Trend Graph Styles --- */
    .agent-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .agent-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      border-left: 3px solid transparent;
      transition: all 0.2s;
    }
    .agent-card.online { border-left-color: #10b981; }
    .agent-card.offline { border-left-color: #6b7280; opacity: 0.7; }
    .agent-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #004da8, #1B365F);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .agent-info {
      flex: 1;
      min-width: 0;
    }
    .agent-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .agent-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .agent-status-dot.online { background: #10b981; box-shadow: 0 0 6px #10b981; }
    .agent-status-dot.away { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }
    .agent-status-dot.offline { background: #ef4444; }
    .agent-task {
      font-size: 0.85rem;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .agent-meta {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 4px;
    }
    .agent-caps {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .cap-tag {
      background: rgba(0, 77, 168, 0.25);
      color: #75D3F2;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
    }
    .agent-history {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 0.8rem;
      color: #6b7280;
    }
    .agent-empty-tip {
      text-align: center;
      padding: 20px;
      color: #6b7280;
      font-size: 0.85rem;
    }
    .agent-empty-tip code {
      background: rgba(0, 77, 168, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      color: #75D3F2;
      font-family: monospace;
    }
    .trend-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .trend-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all .18s;
    }
    .trend-btn:hover { background: rgba(255,255,255,0.12); }
    .trend-btn.active {
      background: rgba(74,125,181,0.35);
      border-color: #4A7DB5;
      color: #fff;
      font-weight: 600;
    }

    .trend-graph-wrap {
      position: relative;
      width: 100%;
      height: 220px;
    }
    .trend-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .trend-line {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .trend-dot {
      fill: #0a1628;
      stroke-width: 2.5;
      r: 3.5;
    }
    .trend-axis {
      stroke: #334155;
      stroke-width: 1;
    }
    .trend-grid {
      stroke: #1e293b;
      stroke-width: 1;
    }
    .trend-text {
      fill: #94a3b8;
      font-size: 10px;
    }
    .trend-legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .trend-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #94a3b8;
    }
    /* Line Chart */
    .line-chart-container {
      width: 100%;
      height: auto;
      padding: 10px 0;
    }

    .line-chart-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .line-chart-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 8px 0;
      font-size: 0.85rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .legend-item:hover {
      opacity: 0.8;
    }

    .legend-item.hidden-series {
      opacity: 0.4;
    }

    .legend-line {
      width: 20px;
      height: 3px;
      border-radius: 2px;
    }

    .legend-line.dashed {
      background-image: linear-gradient(90deg, currentColor 50%, transparent 50%);
      background-size: 8px 3px;
    }

    .line-chart-svg {
      width: 100%;
      max-width: 1200px;
      height: 280px;
    }

    .chart-line {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke-opacity 0.3s, stroke-width 0.3s;
    }

    .chart-line.open { stroke-dasharray: 6,4; }

    .chart-area {
      opacity: 0.15;
      transition: opacity 0.3s;
    }

    .chart-grid {
      stroke: rgba(255,255,255,0.06);
      stroke-width: 1;
    }

    .chart-axis {
      stroke: rgba(255,255,255,0.15);
      stroke-width: 1;
    }

    .chart-label {
      fill: #6b7280;
      font-size: 10px;
      font-family: inherit;
    }

    .chart-point {
      r: 3.5;
      fill: #0a1628;
      stroke-width: 2;
      transition: r 0.2s, stroke-width 0.2s;
      cursor: pointer;
    }

    .chart-point:hover {
      r: 5.5;
      stroke-width: 3;
    }

    .chart-tooltip {
      position: absolute;
      background: rgba(27, 54, 95, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.85rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 100;
    }

    .chart-tooltip.visible {
      opacity: 1;
    }

    .chart-tooltip-title {
      font-weight: 600;
      margin-bottom: 4px;
      color: #e0e6ed;
    }

    .chart-tooltip-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }

    .chart-tooltip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🚀 FBCA Mission Control</h1>
      <div class="health-badge healthy" id="health-badge">
        🟢 All Healthy
      </div>
    </header>

    <div id="loading" class="loading">
      Loading dashboard...
    </div>

    <div id="dashboard" style="display: none;">
      <!-- Tickets Last 30 Days Line Chart -->
      <div class="card" style="margin-bottom: 20px;">
        <div class="card-header">
          <div class="card-title">
            📈 Tickets - Last 30 Days
            <span class="badge" id="tickets-30d-total">0</span>
          </div>
          <div class="toggle-group" id="ticket-toggle-group">
            <button class="toggle-btn active" data-mode="open">Open</button>
            <button class="toggle-btn" data-mode="resolved">Resolved</button>
            <button class="toggle-btn" data-mode="both">Both</button>
          </div>
        </div>
        <div class="line-chart-wrapper">
          <div id="tickets-30d-chart" class="line-chart-container"></div>
        </div>
      </div>

      <!-- Monthly Stats Bar Chart -->
      <div class="card" style="margin-bottom: 20px;">
        <div class="card-header">
          <div class="card-title">
            📊 Closed This Month
            <span class="badge" id="monthly-closed-count">0</span>
          </div>
        </div>
        <div id="monthly-stats-content">
          <div class="loading">Loading stats...</div>
        </div>
      </div>

      <!-- ClickUp Tickets -->
      <div class="card" style="margin-bottom: 20px;">
        <div class="card-header">
          <div class="card-title">
            📋 ClickUp Tickets
            <span class="badge" id="tickets-count">0</span>
          </div>
        </div>
        <div id="tickets-content"></div>
      </div>

      <div class="grid">
        <!-- PCO Approvals -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              📅 PCO Pending Approvals
              <span class="badge" id="approvals-count">0</span>
            </div>
          </div>
          <div id="approvals-content"></div>
        </div>
      </div>

      <!-- Door Schedules & Email -->
      <div class="grid">
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              🚪 Today's Door Schedules
              <span class="badge" id="schedules-count">0</span>
            </div>
          </div>
          <div id="schedules-content"></div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">📧 Email Status</div>
          </div>
          <div id="email-content"></div>
        </div>
      </div>

      <!-- Agent Status & System Health -->
      <div class="grid">
        <div class="card">
          <div class="card-header">
            <div class="card-title">🤖 Agent Activity</div>
          </div>
          <div id="agents-content"></div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">🏥 System Health</div>
          </div>
          <div id="health-content"></div>
        </div>
      </div>
    </div>

    <div class="timestamp" id="timestamp"></div>
  </div>

  <div class="chart-tooltip" id="chart-tooltip">
    <div class="chart-tooltip-title"></div>
    <div class="chart-tooltip-content"></div>
  </div>

  <script>
    const API_BASE = '/api';
    const DEPARTMENTS = ['Maintenance', 'IT', 'Cleaning'];
    const DEPT_COLORS = {
      'Maintenance': '#4A7DB5',
      'IT': '#75D3F2',
      'Cleaning': '#6B7280'
    };
    const DEPT_LABELS = {
      'Maintenance': 'Maint',
      'IT': 'IT',
      'Cleaning': 'Clean'
    };
    let currentTicketMode = 'open';
    let chartData30d = null;
    let hiddenDepartments = new Set();

    function generate30DayData() {
      const data = {};
      
      DEPARTMENTS.forEach(dept => {
        data[dept] = [];
        let openBase = Math.floor(Math.random() * 5) + 2;
        let resolvedBase = Math.floor(Math.random() * 5) + 1;
        
        for (let i = 0; i < 30; i++) {
          const date = new Date();
          date.setDate(date.getDate() - (29 - i));
          
          // Add some realistic fluctuation with trend
          openBase = Math.max(1, Math.min(12, openBase + (Math.random() - 0.48) * 3));
          resolvedBase = Math.max(1, Math.min(12, resolvedBase + (Math.random() - 0.47) * 2.5));
          
          // Weekend dip
          const dayOfWeek = date.getDay();
          const weekendFactor = (dayOfWeek === 0 || dayOfWeek === 6) ? 0.6 : 1;
          
          const open = Math.max(0, Math.round(openBase * weekendFactor + (Math.random() - 0.5)));
          const resolved = Math.max(0, Math.round(resolvedBase * weekendFactor + (Math.random() - 0.5)));
          
          data[dept].push({
            date: date.toISOString().split('T')[0],
            open: open,
            resolved: resolved
          });
        }
      });
      
      return data;
    }

    function smoothPath(data, width, height, padding) {
      if (data.length === 0) return '';
      
      const xStep = (width - padding.left - padding.right) / (data.length - 1);
      const maxVal = Math.max(...data.map(d => d.value), 1);
      const chartHeight = height - padding.top - padding.bottom;
      
      const points = data.map((d, i) => ({
        x: padding.left + i * xStep,
        y: padding.top + chartHeight - (d.value / maxVal) * chartHeight
      }));
      
      if (points.length === 1) {
        return `M ${points[0].x} ${points[0].y}`;
      }
      
      // Catmull-Rom spline to cubic bezier
      let path = `M ${points[0].x} ${points[0].y}`;
      
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[Math.max(i - 1, 0)];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[Math.min(i + 2, points.length - 1)];
        
        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;
        
        path += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
      }
      
      return path;
    }

    function render30DayChart() {
      const container = document.getElementById('tickets-30d-chart');
      if (!chartData30d) return;
      
      const width = 1200;
      const height = 280;
      const padding = { top: 10, right: 30, bottom: 40, left: 40 };
      
      // Calculate global max for consistent scaling
      let globalMax = 0;
      Object.values(chartData30d).forEach(deptData => {
        deptData.forEach(d => {
          if (currentTicketMode === 'open' || currentTicketMode === 'both') {
            globalMax = Math.max(globalMax, d.open);
          }
          if (currentTicketMode === 'resolved' || currentTicketMode === 'both') {
            globalMax = Math.max(globalMax, d.resolved);
          }
        });
      });
      globalMax = Math.max(globalMax, 1);
      
      const chartWidth = width - padding.left - padding.right;
      const chartHeight = height - padding.top - padding.bottom;
      
      // Generate grid lines
      const gridCount = 5;
      let gridLinesHtml = '';
      for (let i = 0; i <= gridCount; i++) {
        const y = padding.top + (chartHeight / gridCount) * i;
        const val = Math.round(globalMax - (globalMax / gridCount) * i);
        gridLinesHtml += `
          <line class="chart-grid" x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}"/>
          <text class="chart-label" x="${padding.left - 8}" y="${y + 4}" text-anchor="end">${val}</text>
        `;
      }
      
      // X-axis labels
      let xLabelsHtml = '';
      const days = chartData30d[DEPARTMENTS[0]];
      for (let i = 0; i < days.length; i++) {
        const date = new Date(days[i].date);
        const dayOfWeek = date.getDay();
        const showLabel = i === 0 || i === days.length - 1 || i % 7 === 0;
        
        if (showLabel) {
          const x = padding.left + (i / (days.length - 1)) * chartWidth;
          const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          const dayNames = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
          const label = `${monthNames[date.getMonth()]} ${date.getDate()}`;
          
          xLabelsHtml += `
            <text class="chart-label" x="${x}" y="${height - 14}" text-anchor="middle">${label}</text>
          `;
        }
      }
      
      // Axis lines
      const axisHtml = `
        <line class="chart-axis" x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}"/>
        <line class="chart-axis" x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}"/>
      `;
      
      // Generate lines and points
      let linesHtml = '';
      let pointsHtml = '';
      let legendHtml = '';
      
      DEPARTMENTS.forEach(dept => {
        if (hiddenDepartments.has(dept)) return;
        
        const color = DEPT_COLORS[dept];
        const deptData = chartData30d[dept];
        const isHidden = hiddenDepartments.has(dept);
        const opacity = isHidden ? 0 : 1;
        
        // Open line
        if (currentTicketMode === 'open' || currentTicketMode === 'both') {
          const openPath = smoothPath(
            deptData.map(d => ({ value: d.open })),
            width, height, padding
          );
          const areaPath = `${openPath} L ${width - padding.right} ${height - padding.bottom} L ${padding.left} ${height - padding.bottom} Z`;
          
          linesHtml += `
            <path class="chart-area" d="${areaPath}" fill="${color}" style="opacity: ${currentTicketMode === 'both' ? 0.08 : 0.15}" />
            <path class="chart-line open" d="${openPath}" stroke="${color}" style="opacity: ${currentTicketMode === 'both' ? 0.8 : 1}" />
          `;
          
          // Open points
          const xStep = chartWidth / (deptData.length - 1);
          deptData.forEach((d, i) => {
            const x = padding.left + i * xStep;
            const y = padding.top + chartHeight - (d.open / globalMax) * chartHeight;
            pointsHtml += `
              <circle class="chart-point open-point" cx="${x}" cy="${y}" stroke="${color}" 
                data-dept="${dept}" data-date="${d.date}" data-type="open" data-val="${d.open}"
                style="opacity: ${currentTicketMode === 'both' ? 0.7 : 1}; display: ${isHidden ? 'none' : 'block'}" />
            `;
          });
        }
        
        // Resolved line
        if (currentTicketMode === 'resolved' || currentTicketMode === 'both') {
          const resolvedPath = smoothPath(
            deptData.map(d => ({ value: d.resolved })),
            width, height, padding
          );
          const areaPath = `${resolvedPath} L ${width - padding.right} ${height - padding.bottom} L ${padding.left} ${height - padding.bottom} Z`;
          
          linesHtml += `
            <path class="chart-area" d="${areaPath}" fill="${color}" style="opacity: ${currentTicketMode === 'both' ? 0.08 : 0.15}" />
            <path class="chart-line" d="${resolvedPath}" stroke="${color}" style="opacity: ${currentTicketMode === 'both' ? 1 : 1}" />
          `;
          
          // Resolved points
          const xStep = chartWidth / (deptData.length - 1);
          deptData.forEach((d, i) => {
            const x = padding.left + i * xStep;
            const y = padding.top + chartHeight - (d.resolved / globalMax) * chartHeight;
            pointsHtml += `
              <circle class="chart-point resolved-point" cx="${x}" cy="${y}" stroke="${color}"
                data-dept="${dept}" data-date="${d.date}" data-type="resolved" data-val="${d.resolved}"
                style="display: ${isHidden ? 'none' : 'block'}" />
            `;
          });
        }
        
        // Legend
        const legendStyle = isHidden ? 'hidden-series' : '';
        legendHtml += `
          <div class="legend-item ${legendStyle}" onclick="toggleDepartment('${dept}')">
            <span class="legend-line ${currentTicketMode === 'open' ? 'dashed' : ''}" style="background: ${color};"></span>
            <span style="color: ${color};">${DEPT_LABELS[dept]}</span>
          </div>
        `;
      });
      
      container.innerHTML = `
        <svg class="line-chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
          ${gridLinesHtml}
          ${axisHtml}
          ${linesHtml}
          ${pointsHtml}
          ${xLabelsHtml}
        </svg>
        <div class="line-chart-legend">
          ${legendHtml}
        </div>
      `;
      
      // Update total badge
      let total = 0;
      Object.values(chartData30d).forEach(deptData => {
        deptData.forEach(d => {
          if (currentTicketMode === 'open' || currentTicketMode === 'both') total += d.open;
          if (currentTicketMode === 'resolved' || currentTicketMode === 'both') total += d.resolved;
        });
      });
      document.getElementById('tickets-30d-total').textContent = total.toLocaleString();
      
      // Attach tooltip events
      attachChartTooltipEvents();
    }

    function attachChartTooltipEvents() {
      const points = document.querySelectorAll('.chart-point');
      const tooltip = document.getElementById('chart-tooltip');
      const titleEl = tooltip.querySelector('.chart-tooltip-title');
      const contentEl = tooltip.querySelector('.chart-tooltip-content');
      
      points.forEach(point => {
        point.addEventListener('mouseenter', (e) => {
          const dept = e.target.dataset.dept;
          const date = e.target.dataset.date;
          const type = e.target.dataset.type;
          const val = e.target.dataset.val;
          const color = DEPT_COLORS[dept];
          
          const dateObj = new Date(date + 'T00:00:00');
          const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
          const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          const formattedDate = `${dayNames[dateObj.getDay()]}, ${monthNames[dateObj.getMonth()]} ${dateObj.getDate()}`;
          
          titleEl.textContent = formattedDate;
          contentEl.innerHTML = `
            <div class="chart-tooltip-row">
              <span class="chart-tooltip-dot" style="background: ${color};"></span>
              <span>${dept} — ${type === 'open' ? 'Open' : 'Resolved'}: ${val}</span>
            </div>
          `;
          
          const rect = e.target.getBoundingClientRect();
          tooltip.style.left = rect.left + 'px';
          tooltip.style.top = (rect.top - tooltip.offsetHeight - 10) + 'px';
          tooltip.classList.add('visible');
        });
        
        point.addEventListener('mouseleave', () => {
          tooltip.classList.remove('visible');
        });
      });
    }

    function toggleDepartment(dept) {
      if (hiddenDepartments.has(dept)) {
        hiddenDepartments.delete(dept);
      } else {
        // Don't hide all departments
        if (hiddenDepartments.size < DEPARTMENTS.length - 1) {
          hiddenDepartments.add(dept);
        }
      }
      render30DayChart();
    }

    function setupTicketToggle() {
      const buttons = document.querySelectorAll('#ticket-toggle-group .toggle-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTicketMode = btn.dataset.mode;
          render30DayChart();
        });
      });
    }

    async function fetchMonthlyStats() {
      try {
        const res = await fetch(`${API_BASE}/monthly-stats`);
        const data = await res.json();
        renderMonthlyStats(data);
      } catch (e) {
        console.error('Monthly stats failed:', e);
        document.getElementById('monthly-stats-content').innerHTML = '<div class="empty">Stats unavailable</div>';
      }
    }

    function renderMonthlyStats(stats) {
      const container = document.getElementById('monthly-stats-content');
      const countEl = document.getElementById('monthly-closed-count');
      const depts = stats.by_department || {};
      const total = stats.total_closed || 0;
      countEl.textContent = total;

      if (total === 0) {
        container.innerHTML = '<div class="empty">No tickets closed this month</div>';
        return;
      }

      const maxVal = Math.max(...Object.values(depts));
      const labels = {
        'IT': 'IT',
        'Maintenance': 'Maint',
        'Cleaning': 'Clean',
        'Unassigned': 'Unassigned'
      };
      const colors = {
        'IT': 'it',
        'Maintenance': 'maintenance',
        'Cleaning': 'cleaning',
        'Unassigned': 'unassigned'
      };

      let barsHtml = '';
      let legendHtml = '';
      const order = ['Maintenance', 'IT', 'Cleaning', 'Unassigned'];

      order.forEach(dept => {
        const val = depts[dept] || 0;
        if (val === 0) return;
        const heightPct = maxVal > 0 ? (val / maxVal) * 140 : 4;
        barsHtml += `
          <div class="bar-item">
            <div class="bar ${colors[dept]}" style="height: ${heightPct}px;">
              <span class="bar-value">${val}</span>
            </div>
            <div class="bar-label">${labels[dept]}</div>
          </div>
        `;
        const colorHex = {
          'IT': '#3b82f6',
          'Maintenance': '#f59e0b',
          'Cleaning': '#10b981',
          'Unassigned': '#ef4444'
        };
        legendHtml += `
          <div class="stat-pill">
            <span class="stat-dot" style="background: ${colorHex[dept]}"></span>
            ${dept}: ${val}
          </div>
        `;
      });

      container.innerHTML = `
        <div class="bar-chart">${barsHtml}</div>
        <div class="stats-summary">${legendHtml}</div>
      `;
    }

    async function fetchDashboard() {
      try {
        const response = await fetch(`${API_BASE}/dashboard`);
        const data = await response.json();

        fetchMonthlyStats();
        renderTickets(data.tickets);
        renderApprovals(data.approvals);
        renderSchedules(data.schedules);
        renderEmail(data.email);
        renderAgents(data.agents);
        renderHealth(data.health);

        document.getElementById('loading').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('timestamp').textContent = 
          `Last updated: ${new Date(data.timestamp).toLocaleTimeString()}`;

        // Update health badge
        const issuesCount = data.health.issuesCount || 0;
        const badge = document.getElementById('health-badge');
        if (issuesCount === 0) {
          badge.className = 'health-badge healthy';
          badge.textContent = '🟢 All Healthy';
        } else if (issuesCount < 3) {
          badge.className = 'health-badge warning';
          badge.textContent = `⚠️ ${issuesCount} Issue(s)`;
        } else {
          badge.className = 'health-badge error';
          badge.textContent = `❌ ${issuesCount} Issues`;
        }
      } catch (error) {
        console.error('Failed to fetch dashboard:', error);
      }
    }

    function renderTickets(tickets) {
      const container = document.getElementById('tickets-content');
      const count = document.getElementById('tickets-count');
      const depts = tickets.departments || {};
      const total = tickets.total || 0;
      
      count.textContent = total;
      
      if (total === 0) {
        container.innerHTML = '<div class="empty">No open tickets</div>';
        return;
      }
      
      const deptConfig = {
        'Unassigned': { icon: '🔴', class: 'unassigned', alwaysExpanded: true },
        'IT': { icon: '💻', class: 'it', alwaysExpanded: false },
        'Maintenance': { icon: '🔧', class: 'maintenance', alwaysExpanded: false },
        'Cleaning': { icon: '🧹', class: 'cleaning', alwaysExpanded: false }
      };
      
      const deptOrder = ['Unassigned', 'IT', 'Maintenance', 'Cleaning'];
      let html = '';
      
      deptOrder.forEach(dept => {
        const items = depts[dept] || [];
        if (items.length === 0) return;
        
        const config = deptConfig[dept] || { icon: '📌', class: 'unassigned', alwaysExpanded: false };
        const isUnassigned = dept === 'Unassigned';
        const countClass = isUnassigned ? 'badge-red' : 'badge';
        const expandClass = config.alwaysExpanded ? 'always-expanded' : '';
        const collapseIcon = config.alwaysExpanded ? '' : '<span class="collapse-icon">▼</span>';
        
        html += `
          <div class="dept-section" data-dept="${dept}">
            <div class="dept-header ${config.class}" onclick="toggleSection('${dept}')">
              <span><span class="dept-icon">${config.icon}</span> ${dept}</span>
              <span style="display: flex; align-items: center; gap: 8px;">
                <span class="${countClass}">${items.length}</span>
                ${collapseIcon}
              </span>
            </div>
            <div class="dept-content ${expandClass}" id="dept-${dept}">
              ${items.map(ticket => renderTicketItem(ticket)).join('')}
            </div>
          </div>
        `;
      });
      
      container.innerHTML = html;
    }

    function renderApprovals(approvals) {
      const container = document.getElementById('approvals-content');
      const count = document.getElementById('approvals-count');

      if (!approvals.approvals || approvals.approvals.length === 0) {
        container.innerHTML = '<div class="empty">No pending approvals</div>';
        count.textContent = '0';
        return;
      }

      count.textContent = approvals.approvals.length;
      container.innerHTML = approvals.approvals.map(approval => `
        <div class="item">
          <div class="item-title">${approval.event_name}</div>
          <div class="item-meta">Created: ${new Date(approval.created_at).toLocaleDateString()}</div>
          <div class="actions">
            <button class="btn-primary" onclick="approveEvent('${approval.event_id}')">
              ✅ Approve
            </button>
            <button class="btn-secondary" onclick="viewDetails('${approval.event_id}')">
              📄 Details
            </button>
          </div>
        </div>
      `).join('');
    }

    function renderSchedules(schedules) {
      const container = document.getElementById('schedules-content');
      const count = document.getElementById('schedules-count');

      if (!schedules.schedules || schedules.schedules.length === 0) {
        container.innerHTML = '<div class="empty">No schedules today</div>';
        count.textContent = '0';
        return;
      }

      count.textContent = schedules.schedules.length;
      container.innerHTML = schedules.schedules.slice(0, 5).map(sched => {
        const start = new Date(sched.startTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const end = new Date(sched.endTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        return `
          <div class="item">
            <div class="item-title">${sched.scheduleName}</div>
            <div class="item-meta">${sched.doorName}: ${start} - ${end}</div>
          </div>
        `;
      }).join('');
    }

    function renderEmail(email) {
      const container = document.getElementById('email-content');
      container.innerHTML = `
        <div class="item">
          <div class="item-title">O365: ${email.o365} unread</div>
        </div>
        <div class="item">
          <div class="item-title">Gmail: ${email.gmail} unread</div>
        </div>
      `;
    }

    function renderAgents(agentsData) {
      const container = document.getElementById('agents-content');
      const agents = agentsData.agents || [];
      const message = agentsData.message || '';

      if (!agents || agents.length === 0) {
        container.innerHTML = `
          <div class="agent-empty-tip">
            <div style="font-size: 2rem; margin-bottom: 8px;">🤖</div>
            <div>No agent activity recorded yet.</div>
            <div style="margin-top: 8px;">
              Agents can check in via <code>POST /api/agent-activity</code>
            </div>
            ${message ? `<div style="margin-top: 8px; color: #f59e0b;">Note: ${message}</div>` : ''}
          </div>
        `;
        return;
      }

      container.innerHTML = agents.map(agent => {
        const isOnline = agent.status === 'online';
        const minutes = agent.minutesSince || 0;
        const timeAgo = minutes < 1 ? 'Just now' : 
                        minutes < 60 ? `${minutes}m ago` :
                        minutes < 1440 ? `${Math.floor(minutes/60)}h ago` :
                        `${Math.floor(minutes/1440)}d ago`;
        
        const statusClass = isOnline ? 'online' : 'offline';
        const dotClass = isOnline ? 'online' : 'offline';
        const emoji = getAgentEmoji(agent.agentId);
        
        const capabilitiesHtml = (agent.capabilities || []).slice(0, 3).map(cap => 
          `<span class="cap-tag">${cap}</span>`
        ).join('');
        
        const historyHtml = (agent.history || []).slice(0, 2).map(h => {
          const hTime = new Date(h.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
          return `<div>${hTime} — ${h.details}</div>`;
        }).join('');

        return `
          <div class="agent-card ${statusClass}">
            <div class="agent-avatar">${emoji}</div>
            <div class="agent-info">
              <div class="agent-header">
                <span class="agent-status-dot ${dotClass}"></span>
                <strong>${agent.name}</strong>
                <span style="color: #6b7280; font-size: 0.8rem;">${timeAgo}</span>
              </div>
              <div class="agent-task">${agent.currentTask || 'Idle'}</div>
              ${agent.instanceId ? `<div class="agent-meta">🖥️ ${agent.instanceId}</div>` : ''}
              ${capabilitiesHtml ? `<div class="agent-caps">${capabilitiesHtml}</div>` : ''}
              ${historyHtml ? `<div class="agent-history">${historyHtml}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function getAgentEmoji(agentId) {
      const emojis = {
        cornerstone: '🪨', scout: '📡', doory: '🔧',
        spot: '📹', sentinel: '🛡️', bob: '🦦',
        dubya: '🎯', monty: '🐍'
      };
      return emojis[agentId?.toLowerCase()] || '🤖';
    }

    function renderHealth(health) {
      const container = document.getElementById('health-content');

      if (!health.issues || health.issues.length === 0) {
        container.innerHTML = '<div class="empty">✅ All systems healthy</div>';
        return;
      }

      container.innerHTML = health.issues.map(issue => `
        <div class="item">
          <div class="item-title">${issue}</div>
        </div>
      `).join('');
    }

    function renderTicketItem(ticket) {
      const statusEmoji = {
        'unassigned': '🆕',
        'working': '⚙️',
        'paused': '⏸️',
        'upcoming': '📅'
      }[ticket.status] || '📌';
      
      const priorityEmoji = {
        'urgent': '🔴',
        '1': '🔴',
        'high': '🟠',
        '2': '🟠',
        'normal': '🟡',
        '3': '🟡'
      }[ticket.priority] || '';
      
      const assignee = ticket.assignees && ticket.assignees.length > 0 
        ? ticket.assignees[0].username 
        : 'unassigned';
      
      return `
        <div class="item">
          <div class="item-title">${statusEmoji} ${priorityEmoji} ${ticket.name}</div>
          <div class="item-meta">Status: ${ticket.status} | Assignee: ${assignee}</div>
          <div class="actions">
            <button class="btn-primary" onclick="closeTicket('${ticket.id}')">✅ Close</button>
          </div>
        </div>
      `;
    }

    function toggleSection(dept) {
      if (dept === 'Unassigned') return; // Always expanded
      
      const content = document.getElementById(`dept-${dept}`);
      const header = content.parentElement.querySelector('.dept-header');
      const icon = header.querySelector('.collapse-icon');
      
      if (content.classList.contains('expanded')) {
        content.classList.remove('expanded');
        if (icon) icon.classList.remove('rotated');
      } else {
        content.classList.add('expanded');
        if (icon) icon.classList.add('rotated');
      }
    }

    // Action handlers
    async function closeTicket(id) {
      const resolution = prompt('Enter resolution:');
      if (!resolution) return;

      try {
        await fetch(`${API_BASE}/tickets/${id}/close`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resolution })
        });
        fetchDashboard();
      } catch (error) {
        alert('Failed to close ticket: ' + error.message);
      }
    }

    async function approveEvent(id) {
      const code = prompt('Enter door code (or "unlock"):');
      if (!code) return;

      const time = prompt('Enter time range (e.g., "5:30pm-9:30pm"):');
      if (!time) return;

      try {
        await fetch(`${API_BASE}/approvals/${id}/approve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, time })
        });
        fetchDashboard();
      } catch (error) {
        alert('Failed to approve: ' + error.message);
      }
    }

    function viewDetails(id) {
      alert('Details view coming soon!');
    }

    async function load30DayData() {
      try {
        const res = await fetch(`${API_BASE}/daily-trend`);
        const apiData = await res.json();
        if (!Array.isArray(apiData) || apiData.length === 0) { generate30DayData(); render30DayChart(); return; }
        // Transform API flat array → chartData30d keyed-by-dept, each array of {date:'2026-05-19', open:N, resolved:N}
        const newData = { Maintenance: [], IT: [], Cleaning: [] };
        apiData.forEach(day => {
          ['Maintenance','IT','Cleaning'].forEach(dep => {
            newData[dep].push({ date: day.date, open: day[dep].open, resolved: day[dep].resolved });
          });
        });
        chartData30d = newData;
      } catch (e) {
        console.error('daily-trend load failed', e);
        generate30DayData();
      }
      render30DayChart();
    }

    // Initial load
    load30DayData();
    setupTicketToggle();

    // Initial fetch and auto-refresh
    fetchDashboard();
    setInterval(fetchDashboard, 30000); // Refresh every 30 seconds
  </script>
</body>
</html>
